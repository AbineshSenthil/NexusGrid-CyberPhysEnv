name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Lint
        run: ruff check --select F,E9 .
      - name: Tests
        run: pytest -q
      - name: Baseline evaluation (held-out seeds)
        run: python scripts/evaluate.py --seeds 10 --out /tmp/eval
