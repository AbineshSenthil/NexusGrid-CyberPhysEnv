# NexusGrid-CyberPhysEnv - OpenEnv specification (v3)

spec_version: 1
name: NexusGrid-CyberPhysEnv
type: space
runtime: fastapi
app: server.app:app
port: 8000
version: "3.0.0"
description: >
  Power-grid operations benchmark: DC power flow on a 20-bus network with
  protection relays, frequency dynamics and seeded cyber-physical attacks.
  Six graded operator tasks; every seed draws a new scenario and seeds
  >= 10000 are held out for evaluation.
tags:
  - openenv
  - power-systems
  - critical-infrastructure
  - cybersecurity
  - reinforcement-learning
  - llm-agents

evaluation:
  eval_seed_start: 10000
  score_range: [0.0, 1.0]
  # Mean score on 100 held-out seeds per task (scripts/evaluate.py --seeds 100)
  baselines:
    noop:   {0: 0.000, 1: 0.131, 2: 0.050, 3: 0.000, 4: 0.036, 5: 0.000}
    random: {0: 0.130, 1: 0.157, 2: 0.046, 3: 0.046, 4: 0.054, 5: 0.026}
    expert: {0: 1.000, 1: 1.000, 2: 1.000, 3: 0.999, 4: 0.997, 5: 1.000}

tasks:
  - id: 0
    name: smoke_test
    difficulty: trivial
    max_ticks: 3
    randomised: load level, solar
    rubrics:
      - {name: valid_dispatch, weight: 0.70}
      - {name: stable_after_dispatch, weight: 0.30}
  - id: 1
    name: duck_curve
    difficulty: easy
    max_ticks: 15
    randomised: load ramp size and timing, sunset speed, cloud cover, per-bus demand
    rubrics:
      - {name: band_time, weight: 0.50}
      - {name: no_emergency, weight: 0.25}
      - {name: proactive_response, weight: 0.15}
      - {name: no_overshoot, weight: 0.10}
  - id: 2
    name: cascade_overload
    difficulty: medium
    max_ticks: 20
    randomised: one of 240 validated contingencies (192 train / 48 held out)
    rubrics:
      - {name: relieve_overload, weight: 0.35}
      - {name: protect_critical_load, weight: 0.25}
      - {name: serve_load, weight: 0.20}
      - {name: frequency_band, weight: 0.20}
  - id: 3
    name: phantom_inject
    difficulty: hard
    max_ticks: 18
    randomised: compromised plant, attack start, loss rate and size, decoy traffic
    rubrics:
      - {name: evidence, weight: 0.25}
      - {name: correct_quarantine, weight: 0.30}
      - {name: recovery, weight: 0.30}
      - {name: triage, weight: 0.15}
  - id: 4
    name: stuxnet_resonance
    difficulty: very_hard
    max_ticks: 12
    randomised: oscillating unit, mode frequency, growth rate, onset
    rubrics:
      - {name: mitigate_oscillation, weight: 0.35}
      - {name: turbine_saved, weight: 0.20}
      - {name: detune_unit, weight: 0.15}
      - {name: frequency_band, weight: 0.15}
      - {name: support_dispatch, weight: 0.15}
  - id: 5
    name: black_start
    difficulty: expert
    max_ticks: 50
    randomised: black-start unit, load level, per-bus demand
    rubrics:
      - {name: bootstrap, weight: 0.10}
      - {name: critical_restored, weight: 0.30}
      - {name: load_restored, weight: 0.30}
      - {name: stability, weight: 0.20}
      - {name: frequency_band, weight: 0.10}

observation_schema: GridObservation
action_schema: GridAction
reward_schema: GridReward

hardware:
  max_vcpu: 2
  max_memory_gb: 4
